<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Sinh học 12 - Giữa HK1 | Lê Thánh Tông</title>
<style>
  :root {
    --primary: #0d6efd;
    --success: #198754;
    --danger: #dc3545;
    --warning: #ffc107;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #212529;
    --muted: #6c757d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #0d6efd, #0a58ca);
    color: white;
    padding: 1.2rem 1rem;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 1.35rem; font-weight: 700; }
  .header p { font-size: .85rem; opacity: .9; margin-top: .3rem; }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    padding: .8rem;
    background: white;
    border-bottom: 1px solid #dee2e6;
    position: sticky;
    top: 72px;
    z-index: 99;
  }
  .stat {
    text-align: center;
    min-width: 70px;
  }
  .stat .num { font-size: 1.4rem; font-weight: 700; }
  .stat .label { font-size: .75rem; color: var(--muted); }
  .stat.correct .num { color: var(--success); }
  .stat.wrong .num { color: var(--danger); }
  .stat.remaining .num { color: var(--primary); }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.2rem 1rem 3rem;
  }
  .section-title {
    background: #e7f1ff;
    color: #0a58ca;
    padding: .6rem 1rem;
    border-radius: 8px;
    font-weight: 600;
    margin: 1.5rem 0 .8rem;
    font-size: 1rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    padding: 1.2rem;
    margin-bottom: 1rem;
    border: 2px solid transparent;
    transition: border-color .2s;
  }
  .card.answered-correct { border-color: var(--success); }
  .card.answered-wrong { border-color: var(--danger); }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: .5rem;
    margin-bottom: .8rem;
  }
  .q-num {
    background: var(--primary);
    color: white;
    font-weight: 700;
    font-size: .85rem;
    padding: .2rem .6rem;
    border-radius: 6px;
    white-space: nowrap;
  }
  .q-text { flex: 1; font-size: .95rem; }
  .options { display: flex; flex-direction: column; gap: .5rem; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: .6rem;
    padding: .65rem .9rem;
    border: 1.5px solid #dee2e6;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    background: #fafbfc;
  }
  .opt:hover:not(.disabled) { border-color: var(--primary); background: #e7f1ff; }
  .opt.selected { border-color: var(--primary); background: #cfe2ff; }
  .opt.correct { border-color: var(--success); background: #d1e7dd; }
  .opt.wrong { border-color: var(--danger); background: #f8d7da; }
  .opt.disabled { cursor: default; opacity: .85; }
  .opt input { margin-top: 3px; accent-color: var(--primary); }
  .tf-row {
    display: flex;
    flex-wrap: wrap;
    gap: .6rem;
    margin-top: .4rem;
  }
  .tf-item {
    flex: 1 1 45%;
    min-width: 140px;
  }
  .tf-label {
    font-size: .9rem;
    margin-bottom: .35rem;
    color: #495057;
  }
  .tf-btns { display: flex; gap: .4rem; }
  .btn-tf {
    flex: 1;
    padding: .4rem .5rem;
    border: 1.5px solid #dee2e6;
    border-radius: 6px;
    background: #fafbfc;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-tf:hover:not(:disabled) { border-color: var(--primary); }
  .btn-tf.active-dung { background: #d1e7dd; border-color: var(--success); color: var(--success); }
  .btn-tf.active-sai { background: #f8d7da; border-color: var(--danger); color: var(--danger); }
  .btn-tf:disabled { cursor: default; opacity: .9; }
  .answer-box {
    margin-top: .9rem;
    padding: .75rem 1rem;
    border-radius: 8px;
    font-size: .9rem;
    display: none;
  }
  .answer-box.show { display: block; }
  .answer-box.correct-ans {
    background: #d1e7dd;
    border-left: 4px solid var(--success);
    color: #0f5132;
  }
  .answer-box.wrong-ans {
    background: #f8d7da;
    border-left: 4px solid var(--danger);
    color: #842029;
  }
  .result-panel {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    margin-top: 2rem;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    display: none;
  }
  .result-panel.show { display: block; }
  .result-panel h2 { margin-bottom: .8rem; }
  .score-big { font-size: 2.8rem; font-weight: 800; }
  .score-big.good { color: var(--success); }
  .score-big.mid { color: var(--warning); }
  .score-big.bad { color: var(--danger); }
  .btn-row {
    display: flex;
    gap: .8rem;
    justify-content: center;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: .6rem 1.4rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: .95rem;
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(13,110,253,.35); }
  .btn-outline {
    background: white;
    border: 2px solid var(--primary);
    color: var(--primary);
  }
  .btn-outline:hover { background: #e7f1ff; }
  .progress-wrap {
    height: 6px;
    background: #e9ecef;
    border-radius: 3px;
    margin: .6rem 0 0;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #0d6efd, #20c997);
    width: 0%;
    transition: width .3s;
  }
  .filter-bar {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    justify-content: center;
  }
  .filter-btn {
    padding: .35rem .9rem;
    border-radius: 20px;
    border: 1.5px solid #ced4da;
    background: white;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 500;
  }
  .filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  @media (max-width: 500px) {
    .header h1 { font-size: 1.1rem; }
    .stats-bar { gap: 1rem; }
    .stat .num { font-size: 1.2rem; }
    .tf-item { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>🧬 Ôn tập Sinh học 12 – Giữa HK1</h1>
  <p>Trường TH, THCS & THPT Lê Thánh Tông | Năm học 2024-2025</p>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="stats-bar">
  <div class="stat correct"><div class="num" id="sCorrect">0</div><div class="label">Đúng</div></div>
  <div class="stat wrong"><div class="num" id="sWrong">0</div><div class="label">Sai</div></div>
  <div class="stat remaining"><div class="num" id="sRemain">0</div><div class="label">Còn lại</div></div>
  <div class="stat"><div class="num" id="sPercent">0%</div><div class="label">Tỉ lệ</div></div>
</div>

<div class="container">
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="filterQ(this)">Tất cả</button>
    <button class="filter-btn" data-filter="mc" onclick="filterQ(this)">Trắc nghiệm</button>
    <button class="filter-btn" data-filter="tf" onclick="filterQ(this)">Đúng/Sai</button>
    <button class="filter-btn" data-filter="unanswered" onclick="filterQ(this)">Chưa làm</button>
    <button class="filter-btn" data-filter="wrong" onclick="filterQ(this)">Câu sai</button>
  </div>

  <div id="quizArea"></div>

  <div class="result-panel" id="resultPanel">
    <h2>🎉 Kết quả ôn tập</h2>
    <div class="score-big" id="finalScore">0%</div>
    <p id="finalText"></p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="resetAll()">Làm lại từ đầu</button>
      <button class="btn btn-outline" onclick="showWrongOnly()">Xem lại câu sai</button>
    </div>
  </div>
</div>

<script>
const questions = [
  // ========== PHẦN I: TRẮC NGHIỆM ==========
  {
    id: 1, type: 'mc', section: 'I',
    text: 'Hình sau đây là loại đơn phân nào của nucleic acid?',
    options: ['A. Nucleotide cytosine (C).', 'B. Nucleotide guanine (G).', 'C. Nucleotide adenine (A).', 'D. Nucleotide thymine (T).'],
    answer: 0,
    explain: 'Đáp án A. (Dựa vào hình trong đề – nucleotide cytosine)'
  },
  {
    id: 2, type: 'mc', section: 'I',
    text: 'Mã di truyền là gì?',
    options: [
      'A. Mã bộ ba được đọc liên tục trên mRNA theo chiều 3′ – 5′.',
      'B. Mã bộ ba trên DNA.',
      'C. Mã bộ ba trên DNA được đọc liên tục.',
      'D. Mã bộ ba được đọc liên tục trên mRNA theo chiều 5′ – 3′.'
    ],
    answer: 3,
    explain: 'Đáp án D. Mã di truyền là mã bộ ba được đọc liên tục trên mRNA theo chiều 5′ → 3′.'
  },
  {
    id: 3, type: 'mc', section: 'I',
    text: 'Loại RNA nào đa dạng nhất?',
    options: ['A. mRNA.', 'B. tRNA.', 'C. rRNA.', 'D. RNA enzyme.'],
    answer: 0,
    explain: 'Đáp án A. mRNA đa dạng nhất vì mỗi gene mã hóa một mRNA khác nhau.'
  },
  {
    id: 4, type: 'mc', section: 'I',
    text: 'Trong quá trình tái bản DNA, enzyme ligase (enzyme nối) có vai trò?',
    options: [
      'A. Nối các đoạn Okazaki với nhau.',
      'B. Tách hai mạch đơn của phân tử DNA.',
      'C. Tháo xoắn phân tử DNA.',
      'D. Tổng hợp và kéo dài mạch mới.'
    ],
    answer: 0,
    explain: 'Đáp án A. DNA ligase nối các đoạn Okazaki trên mạch chậm.'
  },
  {
    id: 5, type: 'mc', section: 'I',
    text: 'Hình sau đây mô tả cơ chế di truyền trong tế bào. Nhận định nào sau đây là Đúng về hình này?',
    options: [
      'A. Chiều 1 – 2 là 3′-5′.',
      'B. Chiều của [b] là 3′-5′.',
      'C. Chiều 3 – 4 là 3′-5′.',
      'D. Quá trình này đã cần 6 đoạn mồi được tạo ra nhờ enzyme mRNA polymerase.'
    ],
    answer: 1,
    explain: 'Đáp án B. (Dựa vào chiều tổng hợp DNA/RNA trên hình)'
  },
  {
    id: 6, type: 'mc', section: 'I',
    text: 'Khi nói đến cấu trúc và cơ chế di truyền cấp phân tử, có bao nhiêu phát biểu sau đây đúng?<br>I. Quá trình phiên mã có ở virus, vi khuẩn, sinh vật nhân thực.<br>II. Quá trình dịch mã chỉ có sinh vật nhân thực.<br>III. Ở sinh vật nhân sơ một gene có thể quy định tổng hợp nhiều loại chuỗi polypeptide khác nhau.<br>IV. Trong quá trình nguyên phân sự tái bản DNA diễn ra vào pha S của kì trung gian.<br>V. Ở kì giữa giảm phân 1 các NST kép tập trung 1 hàng ở mặt phẳng xích đạo; ở kì giữa của giảm phân 2 các NST kép tập trung 2 hàng ở mặt phẳng xích đạo.',
    options: ['A. 2.', 'B. 3.', 'C. 4.', 'D. 1.'],
    answer: 0,
    explain: 'Đáp án A (2 phát biểu đúng). I đúng, IV đúng. II sai (dịch mã có ở cả nhân sơ), III sai, V sai (kì giữa giảm phân II NST đơn tập trung 1 hàng).'
  },
  {
    id: 7, type: 'mc', section: 'I',
    text: 'Trong cơ chế điều hòa hoạt động gene của operon Lac ở vi khuẩn E. coli, gene điều hòa có vai trò gì?',
    options: [
      'A. Quy định tổng hợp protein ức chế.',
      'B. Khởi đầu quá trình phiên mã của các gene cấu trúc.',
      'C. Quy định tổng hợp enzyme phân giải lactose.',
      'D. Kết thúc quá trình phiên mã của các gene cấu trúc.'
    ],
    answer: 0,
    explain: 'Đáp án A. Gene điều hòa (I) quy định tổng hợp protein ức chế.'
  },
  {
    id: 8, type: 'mc', section: 'I',
    text: 'Có bao nhiêu phát biểu sau đây đến hoạt động gene / điều hòa hoạt động gene ở sinh vật?<br>I. Điều hoà hoạt động của gene sau phiên mã thực chất là điều khiển sự trưởng thành và thời gian tồn tại của mRNA.<br>II. Ở sinh vật nhân thực, hai gene khác nhau (không bị đột biến) có thể tổng hợp nên các phân tử protein giống nhau.<br>III. Ở sinh vật nhân thực, khi gene bị đột biến thì sản phẩm protein của nó phải khác với sản phẩm protein của gene bình thường.<br>IV. Hoạt động của gene chịu sự kiểm soát chủ yếu của gene điều hoà.',
    options: ['A. 1.', 'B. 2.', 'C. 3.', 'D. 4.'],
    answer: 1,
    explain: 'Đáp án B (2 phát biểu đúng). I và IV đúng. II có thể đúng trong một số trường hợp (gene lặp), III sai vì đột biến có thể không làm thay đổi protein (đồng nghĩa).'
  },
  {
    id: 9, type: 'mc', section: 'I',
    text: 'Một base nitrogen của gene trở thành dạng hiếm thì quá trình tái bản DNA sẽ phát sinh dạng đột biến gì?',
    options: [
      'A. Mất đoạn nhiễm sắc thể.',
      'B. Thêm một cặp nucleotide.',
      'C. Thay thế một cặp nucleotide.',
      'D. Mất một cặp nucleotide.'
    ],
    answer: 2,
    explain: 'Đáp án C. Base dạng hiếm gây đột biến thay thế cặp nucleotide.'
  },
  {
    id: 10, type: 'mc', section: 'I',
    text: 'Loại đột biến nào sau đây làm cho gene đột biến tăng 2 liên kết hydrogen so với gene ban đầu?',
    options: [
      'A. Đột biến mất 1 cặp A-T.',
      'B. Đột biến thêm 1 cặp A-T.',
      'C. Đột biến thay thế 2 cặp G–C bằng 2 cặp A-T.',
      'D. Đột biến thay thế 1 cặp A-T bằng 1 cặp G-C.'
    ],
    answer: 3,
    explain: 'Đáp án D. A-T có 2 liên kết H, G-C có 3 → thay A-T bằng G-C tăng 1 liên kết? Chờ: thực ra tăng 1, nhưng theo đáp án đề là D (tăng 1, nhưng câu hỏi ghi "tăng 2" có thể nhầm). Theo lý thuyết: A-T→G-C tăng 1 liên kết H. Có thể đáp án là D theo đề.'
  },
  {
    id: 11, type: 'mc', section: 'I',
    text: 'Phát biểu nào sau đây là đúng khi nói về đột biến gen?',
    options: [
      'A. Đột biến xảy ra ở tế bào soma (đột biến soma) luôn biểu hiện ra cơ thể.',
      'B. Đột biến gene xảy ra trong những lần nguyên phân đầu tiên của hợp tử luôn biểu hiện ra kiểu hình cơ thể.',
      'C. Đột biến xảy ra trong giảm phân hình thành giao tử không biểu hiện ra kiểu hình ở thế hệ sau.',
      'D. Đột biến soma có thể di truyền bằng sinh sản sinh dưỡng.'
    ],
    answer: 3,
    explain: 'Đáp án D. Đột biến soma có thể di truyền qua sinh sản sinh dưỡng.'
  },
  {
    id: 12, type: 'mc', section: 'I',
    text: 'Hóa chất gây đột biến 5-BU thường gây đột biến gene dạng',
    options: [
      'A. thay thế cặp G–C bằng T–A.',
      'B. thay thế cặp G–C bằng cặp C–G.',
      'C. thay thế cặp A–T bằng T–A.',
      'D. thay thế cặp A–T bằng G–C.'
    ],
    answer: 3,
    explain: 'Đáp án D. 5-BU (5-bromouracil) gây thay thế A-T → G-C.'
  },
  {
    id: 13, type: 'mc', section: 'I',
    text: 'Trong các dạng đột biến sau, có bao nhiêu dạng đột biến không làm thay đổi tỉ lệ (A + G)/(T + C) của gen?<br>I. Thay thế một cặp A-T bằng cặp G-C<br>II. Thay thế một cặp A-T bằng một cặp T-A<br>III. Thêm một cặp nucleotide<br>IV. Mất một cặp nucleotide',
    options: ['A. 3', 'B. 4', 'C. 1', 'D. 2'],
    answer: 3,
    explain: 'Đáp án D (2 dạng). II không đổi (vẫn A=T, G=C), I làm thay đổi. III và IV thường làm thay đổi tỉ lệ.'
  },
  {
    id: 14, type: 'mc', section: 'I',
    text: 'Một gene cấu trúc dài 4080 Å, có tỉ lệ A/G = 3/2, gene này bị đột biến thay thế một cặp A–T bằng một cặp G–C. Số lượng nucleotide từng loại của gene sau đột biến là bao nhiêu?',
    options: [
      'A. A = T = 720; G = C = 480.',
      'B. A = T = 419; G = C = 721.',
      'C. A = T = 719; G = C = 481.',
      'D. A = T = 721; G = C = 479.'
    ],
    answer: 2,
    explain: 'Đáp án C. Chiều dài 4080 Å → số cặp nucleotide = 4080/3.4 = 1200 cặp → 2400 nucleotide. A/G=3/2 → A=T=720, G=C=480. Sau thay A-T→G-C: A=T=719, G=C=481.'
  },
  {
    id: 15, type: 'mc', section: 'I',
    text: 'Trình tự nucleotide trong DNA có tác dụng bảo vệ và làm các NST không dính vào nhau nằm ở đâu?',
    options: ['A. Tâm động.', 'B. Hai đầu mút NST.', 'C. Eo thứ cấp.', 'D. Điểm khởi sự nhân đôi.'],
    answer: 1,
    explain: 'Đáp án B. Telomere (hai đầu mút NST) bảo vệ và ngăn NST dính vào nhau.'
  },
  {
    id: 16, type: 'mc', section: 'I',
    text: 'Mức cấu trúc xoắn nào của nhiễm sắc thể có đường kính 10 nm?',
    options: ['A. Sợi DNA.', 'B. Sợi cơ bản.', 'C. Sợi nhiễm sắc.', 'D. Cấu trúc siêu xoắn.'],
    answer: 1,
    explain: 'Đáp án B. Sợi cơ bản (nucleosome) có đường kính 10 nm.'
  },
  {
    id: 17, type: 'mc', section: 'I',
    text: 'Xét vùng tương đồng của X và Y. Trên NST giới tính X mang các gene ABC, thì NST Y mang gene như thế nào?',
    options: ['A. MNO.', 'B. ABC.', 'C. abc.', 'D. ABCDE.'],
    answer: 1,
    explain: 'Đáp án B. Vùng tương đồng của X và Y mang các gene giống nhau (ABC).'
  },

let state = {}; // id -> { answered, correct, userAnswer }
let currentFilter = 'all';

function init() {
  questions.forEach(q => {
    state[q.id] = { answered: false, correct: false, userAnswer: null };
  });
  render();
  updateStats();
}

function render() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  let lastSection = '';
  questions.forEach(q => {
    if (!shouldShow(q)) return;
    if (q.section !== lastSection) {
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = q.section === 'I' ? 'PHẦN I – Trắc nghiệm nhiều phương án lựa chọn' : 'PHẦN II – Trắc nghiệm đúng / sai';
      area.appendChild(st);
      lastSection = q.section;
    }
    area.appendChild(createCard(q));
  });
}

function shouldShow(q) {
  const s = state[q.id];
  if (currentFilter === 'all') return true;
  if (currentFilter === 'mc') return q.type === 'mc';
  if (currentFilter === 'tf') return q.type === 'tf';
  if (currentFilter === 'unanswered') return !s.answered;
  if (currentFilter === 'wrong') return s.answered && !s.correct;
  return true;
}

function createCard(q) {
  const s = state[q.id];
  const card = document.createElement('div');
  card.className = 'card' + (s.answered ? (s.correct ? ' answered-correct' : ' answered-wrong') : '');
  card.id = 'q' + q.id;

  let html = `<div class="q-header"><span class="q-num">Câu ${q.id > 100 ? q.id - 100 : q.id}</span><div class="q-text">${q.text}</div></div>`;

  if (q.type === 'mc') {
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = 'opt';
      if (s.answered) {
        cls += ' disabled';
        if (i === q.answer) cls += ' correct';
        else if (s.userAnswer === i) cls += ' wrong';
      } else if (s.userAnswer === i) cls += ' selected';
      html += `<label class="${cls}" onclick="selectMC(${q.id},${i})">
        <input type="radio" name="q${q.id}" ${s.userAnswer===i?'checked':''} ${s.answered?'disabled':''}>
        <span>${opt}</span>
      </label>`;
    });
    html += '</div>';
    if (!s.answered) {
      html += `<div style="margin-top:.8rem"><button class="btn btn-primary" style="width:100%" onclick="checkMC(${q.id})">Kiểm tra</button></div>`;
    }
  } else {
    // True/False
    html += '<div class="tf-row">';
    q.statements.forEach((st, i) => {
      const ua = s.userAnswer ? s.userAnswer[i] : null;
      html += `<div class="tf-item">
        <div class="tf-label">${st.text}</div>
        <div class="tf-btns">
          <button class="btn-tf ${ua===true?'active-dung':''}" ${s.answered?'disabled':''} onclick="selectTF(${q.id},${i},true)">Đúng</button>
          <button class="btn-tf ${ua===false?'active-sai':''}" ${s.answered?'disabled':''} onclick="selectTF(${q.id},${i},false)">Sai</button>
        </div>
      </div>`;
    });
    html += '</div>';
    if (!s.answered) {
      html += `<div style="margin-top:.8rem"><button class="btn btn-primary" style="width:100%" onclick="checkTF(${q.id})">Kiểm tra</button></div>`;
    }
  }

  // Answer box
  if (s.answered) {
    const ansCls = s.correct ? 'correct-ans' : 'wrong-ans';
    let ansText = s.correct ? '✅ Chính xác! ' : '❌ Chưa đúng. ';
    if (q.type === 'mc') {
      ansText += `Đáp án đúng: <strong>${q.options[q.answer]}</strong><br>${q.explain || ''}`;
    } else {
      ansText += q.explain || '';
      ansText += '<br>Chi tiết: ';
      q.statements.forEach((st, i) => {
        const ok = s.userAnswer[i] === st.answer;
        ansText += `<br>${ok ? '✓' : '✗'} ${st.text} → <strong>${st.answer ? 'Đúng' : 'Sai'}</strong>`;
      });
    }
    html += `<div class="answer-box show ${ansCls}">${ansText}</div>`;
  }

  card.innerHTML = html;
  return card;
}

function selectMC(id, idx) {
  if (state[id].answered) return;
  state[id].userAnswer = idx;
  render();
}

function checkMC(id) {
  const q = questions.find(x => x.id === id);
  const s = state[id];
  if (s.userAnswer === null || s.userAnswer === undefined) {
    alert('Hãy chọn một đáp án trước!');
    return;
  }
  s.answered = true;
  s.correct = s.userAnswer === q.answer;
  render();
  updateStats();
  checkAllDone();
}

function selectTF(id, stIdx, val) {
  if (state[id].answered) return;
  if (!state[id].userAnswer) state[id].userAnswer = Array(questions.find(x=>x.id===id).statements.length).fill(null);
  state[id].userAnswer[stIdx] = val;
  render();
}

function checkTF(id) {
  const q = questions.find(x => x.id === id);
  const s = state[id];
  if (!s.userAnswer || s.userAnswer.some(x => x === null)) {
    alert('Hãy chọn Đúng/Sai cho tất cả các ý!');
    return;
  }
  s.answered = true;
  s.correct = s.userAnswer.every((ua, i) => ua === q.statements[i].answer);
  render();
  updateStats();
  checkAllDone();
}

function updateStats() {
  let correct = 0, wrong = 0, total = questions.length;
  questions.forEach(q => {
    if (state[q.id].answered) {
      if (state[q.id].correct) correct++;
      else wrong++;
    }
  });
  const done = correct + wrong;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = total - done;
  const pct = done ? Math.round(correct / done * 100) : 0;
  document.getElementById('sPercent').textContent = pct + '%';
  document.getElementById('progressBar').style.width = (done / total * 100) + '%';
}

function checkAllDone() {
  const allDone = questions.every(q => state[q.id].answered);
  if (allDone) {
    const correct = questions.filter(q => state[q.id].correct).length;
    const pct = Math.round(correct / questions.length * 100);
    const scoreEl = document.getElementById('finalScore');
    scoreEl.textContent = pct + '%';
    scoreEl.className = 'score-big ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    document.getElementById('finalText').textContent = `Bạn đúng ${correct}/${questions.length} câu.`;
    document.getElementById('resultPanel').classList.add('show');
    document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth' });
  }
}

function filterQ(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  render();
}

function resetAll() {
  if (!confirm('Bạn muốn làm lại tất cả câu hỏi từ đầu?')) return;
  questions.forEach(q => {
    state[q.id] = { answered: false, correct: false, userAnswer: null };
  });
  document.getElementById('resultPanel').classList.remove('show');
  currentFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
  render();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showWrongOnly() {
  currentFilter = 'wrong';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn[data-filter="wrong"]').classList.add('active');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
